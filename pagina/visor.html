<!-- Visor día por día (#49, #51): lo comparten index.html y simulador.html. visor.js lo llena. -->
<div class="visor" id="visor" hidden>
  <div class="visor-controles">
    <div class="visor-escenarios segmentado" role="group" aria-label="Situación del puesto"></div>
    <div class="visor-pasos">
      <button type="button" class="visor-anterior" aria-label="Día anterior">←</button>
      <p class="visor-dia" aria-live="off"></p>
      <button type="button" class="visor-siguiente" aria-label="Día siguiente">→</button>
      <button type="button" class="visor-reproducir boton-chico" aria-pressed="false">Reproducir</button>
    </div>
    <label class="visor-etiqueta-rango">
      <span class="solo-lectores">Día de la simulación</span>
      <input type="range" class="visor-rango" min="1" step="1" value="1">
    </label>
  </div>
  <p class="visor-descripcion nota"></p>

  <ul class="cifras visor-cifras" aria-label="Acumulado hasta el día elegido">
    <li>
      <span class="cifra-titulo"><span class="muestra a" aria-hidden="true"></span>Merma acumulada en A</span>
      <span class="cifra visor-a"></span>
      <span class="cifra-texto visor-a-costo"></span>
    </li>
    <li>
      <span class="cifra-titulo"><span class="muestra b" aria-hidden="true"></span>Merma acumulada en B</span>
      <span class="cifra visor-b"></span>
      <span class="cifra-texto visor-b-costo"></span>
    </li>
    <li>
      <span class="cifra-titulo">Desperdicio evitado hasta hoy</span>
      <span class="cifra visor-evitado"></span>
      <span class="cifra-texto visor-ahorro"></span>
    </li>
  </ul>

  <figure class="visor-figura">
    <figcaption>
      <strong>Merma acumulada, en kg.</strong>
      <span class="leyenda"><span class="muestra a" aria-hidden="true"></span>A · solo menú fijo</span>
      <span class="leyenda"><span class="muestra b" aria-hidden="true"></span>B · fijo + menú del día</span>
    </figcaption>
    <div class="visor-lienzo">
      <div class="visor-grafica"></div>
      <div class="visor-ayuda" role="tooltip" hidden></div>
    </div>
  </figure>

  <div class="visor-paneles">
    <div class="tarjeta">
      <h3>Menú del día que propuso el voraz</h3>
      <div class="visor-menu"></div>
      <p class="nota visor-fijo"></p>
    </div>
    <div class="tarjeta">
      <h3>Lo que se tiró este día</h3>
      <div class="visor-merma"></div>
    </div>
  </div>

  <h3>Ingredientes que vencen pronto</h3>
  <p class="nota">Lo que hay al empezar el día de cada ingrediente que vence en los próximos 3 días.</p>
  <div class="visor-por-vencer"></div>
  <p class="visor-anuncio solo-lectores" aria-live="polite"></p>
</div>
